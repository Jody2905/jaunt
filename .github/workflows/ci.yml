name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests, Python ${{ matrix.python }} (SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -rs
      - name: Walk through the booking rules
        run: python -m jaunt demo

  postgres:
    name: Tests on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jaunt
          POSTGRES_PASSWORD: jaunt
          POSTGRES_DB: jaunt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jaunt" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JAUNT_TEST_DATABASE_URL: postgresql+psycopg://jaunt:jaunt@localhost:5432/jaunt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -rs
      - name: Build the demo database with the migrations
        run: python -m jaunt init-demo --db "$JAUNT_TEST_DATABASE_URL" --reset

  browser:
    name: Browser test (Chromium)
    runs-on: ubuntu-latest
    env:
      JAUNT_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_frontend.py -rs
