[project]
name = "jaunt"
version = "1.0.0"
description = "A playful travel planner: day-by-day itineraries plus bookable stays, flights, tours and car hire."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",   # assert is how pytest tests are written
    "S311",   # random is only used to make up demo data, never for secrets
    "B008",   # FastAPI's Depends(...) in argument defaults is the intended style
    "UP017",  # keep datetime.now() naive: the app works in island local time
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]          # test passwords are fixtures, not secrets
"jaunt/__main__.py" = ["S105"]        # the demo password is printed for people to use
"tools/*" = ["S603", "S607"]          # the video script runs ffmpeg on purpose
